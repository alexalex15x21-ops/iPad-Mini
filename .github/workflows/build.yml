name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repo root"
            exit 1
          fi
          echo "Using: $ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project
          SETTINGS=$(find project -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found inside the zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: iPadMini-Browser-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
